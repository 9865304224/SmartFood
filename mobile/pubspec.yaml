name: smartfood_mobile
description: "SmartFood — Full-Stack AI Food Delivery Platform Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Architecture
  flutter_riverpod: ^2.5.1

  # Networking & REST API
  dio: ^5.4.3+1

  # WebSockets for Live Delivery Tracking
  web_socket_channel: ^2.4.5

  # OpenStreetMap & Map Visualization
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Local Persistence
  shared_preferences: ^2.2.3

  # Formatting & Utilities
  intl: ^0.19.0

  # Image Picker & Mobile Camera / Gallery
  image_picker: ^1.1.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
